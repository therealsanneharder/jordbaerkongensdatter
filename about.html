<h1>Om bogen</h1>

<p>
Jordbærkongens datter er en billedbog om en pige,
der vokser op på landet i Danmark i efterkrigstiden.
</p>

<p>
Historien bygger på virkelige minder fra min mors barndom.
</p>

<img src="images/illustration3.jpg" class="illustration">

<p>
Bogen er skabt for at bevare disse minder
og give børn et indblik i livet på landet i gamle dage.
</p>
